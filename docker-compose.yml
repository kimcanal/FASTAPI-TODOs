services:
  fastapi-app:
    build:
      context: ./fastapi-app      # Dockerfile이 위치한 디렉토리 경로
      dockerfile: Dockerfile      # Dockerfile 이름 (생략 가능, 기본값은 'Dockerfile')
    container_name: ${CONTAINER_NAME:-FastApi-app}   # 공용 서버에서는 이름이 겹치지 않게 지정
    ports:
      - "${HOST_PORT:-5001}:8000"   # 외부포트:내부포트
    environment:
      BUILD_NUMBER: ${BUILD_NUMBER:-local}   # Jenkins 빌드 번호 (화면 하단에 표시)
      GIT_COMMIT: ${GIT_COMMIT:-}
    volumes:
      - todo-data:/app/data       # DB·세션 키 보존 (재배포해도 데이터 유지)
    restart: unless-stopped       # 서버 재부팅·오류 시 자동 재시작
    security_opt:
      - no-new-privileges:true    # 컨테이너 안에서 권한 상승 차단
    cap_drop:
      - ALL                       # 불필요한 커널 권한 모두 제거
    networks:
      - loadtest-net

  sonarqube:
    # latest 태그는 재현이 안 되고, 어느 날 메이저 업그레이드가 끼어들어 DB 마이그레이션이 터진다.
    # Community Build 최신 버전으로 고정 (2026-11 기준)
    image: sonarqube:26.10.0.133078-community
    container_name: sonarqube
    depends_on:
      - sonar-db
    ports:
      # 0.0.0.0 바인딩 금지 — 인증 없는 관리 UI가 전 인터넷에 열린다.
      # 접속은 SSH 터널(ssh -L 9000:127.0.0.1:9000 ...) 또는 Tailscale로.
      - "127.0.0.1:9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    restart: unless-stopped
    networks:
      - loadtest-net

  sonar-db:
    image: postgres:16-alpine
    container_name: sonar-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
      POSTGRES_DB: sonar
    volumes:
      - sonar-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - loadtest-net

  prometheus:
    image: prom/prometheus:v3.15.1              # 최신 안정 버전 고정
    container_name: prometheus
    read_only: true                             # 컨테이너 파일시스템 읽기 전용 (데이터 볼륨만 쓰기 가능)
    security_opt:
      - no-new-privileges:true                  # 컨테이너 안에서 권한 상승 차단
    cap_drop:
      - ALL                                     # 불필요한 커널 권한 모두 제거
    ports:
      - "127.0.0.1:7070:9090"                   # 서버 자신에게만 공개 (Prometheus는 로그인 기능이 없음)
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro   # 설정 파일은 읽기 전용(:ro)
      - prometheus-data:/prometheus             # 수집한 메트릭 저장 (컨테이너를 다시 만들어도 유지)
    restart: unless-stopped
    networks:
      - loadtest-net

  grafana:
    image: grafana/grafana:13.3.0               # 최신 안정 버전 고정
    container_name: grafana
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:3000:3000"                   # 외부 노출 금지 — SSH 터널/Tailscale로 접속
    environment:
      # admin/admin 을 평문으로 박아두면 포트가 열리는 순간 바로 관리자 계정이 털린다.
      # 비밀번호는 git에 올라가지 않는 .env 파일에 둔다 (.gitignore에 .env 추가 필수, .env.example 참고).
      # 이미 초기화된 Grafana 볼륨에는 이 값이 적용되지 않는다 — 최초 1회 기동 시에만 사용되는 값이고,
      # 이미 다른 비밀번호로 바꿔둔 상태라면 그 비밀번호가 계속 유효하다.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD를 .env에 설정하세요}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_PASSWORD_POLICY: "true"       # 비밀번호 12자 이상 + 대·소문자·숫자·특수문자 필수
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - loadtest-net

  node-exporter:
    image: prom/node-exporter:v1.12.1           # latest 대신 버전 고정
    container_name: node-exporter
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # ports 없음: Prometheus가 내부 네트워크(node-exporter:9100)로 수집하므로 외부 공개 불필요.
    # (node-exporter는 인증이 전혀 없이 호스트의 CPU/메모리/네트워크/마운트 정보를 그대로 노출하므로
    #  외부에 열어두면 정찰·증폭 공격의 표적이 된다)
    restart: unless-stopped
    networks:
      - loadtest-net

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6      # v0.53.0부터 이미지 위치가 ghcr.io로 변경
    container_name: cadvisor
    privileged: true                            # 컨테이너별 cgroup/디스크 메트릭을 읽기 위해 필요
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    # ports 없음: 8080은 Jenkins 포트와 겹치고, Prometheus가 내부 네트워크(cadvisor:8080)로 수집
    restart: unless-stopped
    networks:
      - loadtest-net

  influxdb:
    image: influxdb:1.8                         # JMeter 내장 InfluxdbBackendListenerClient가 쓰는 v1 라인 프로토콜 API
    container_name: ${INFLUXDB_CONTAINER_NAME:-influxdb}   # 공용(팀) 서버에서는 이름이 겹치지 않게 지정
    environment:
      INFLUXDB_DB: jmeter
      INFLUXDB_HTTP_AUTH_ENABLED: "false"        # 외부 미공개 + 내부망 전용이라 JMeter/Grafana만 접근
    volumes:
      - influxdb-data:/var/lib/influxdb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    # ports 없음: Grafana/JMeter가 내부 네트워크(influxdb:8086)로만 접근
    restart: unless-stopped
    networks:
      - loadtest-net

  jmeter:
    build:
      context: ./jmeter
      dockerfile: Dockerfile
    container_name: ${JMETER_CONTAINER_NAME:-jmeter}   # 공용(팀) 서버에서는 이름이 겹치지 않게 지정
    depends_on:
      fastapi-app:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    volumes:
      - ./jmeter:/jmeter
    command:
      - jmeter
      - -n
      - -t
      - /jmeter/fastapi_test_plan.jmx
      - -l
      - /jmeter/results.jtl
      - -JTARGET_HOST=fastapi-app
      - -JTARGET_PORT=8000
      - -JINFLUXDB_URL=http://influxdb:8086/write?db=jmeter
      - -Jjmeter.save.saveservice.output_format=csv
      - -e
      - -o
      - /jmeter/report
    networks:
      - loadtest-net

networks:
  loadtest-net:
    driver: bridge

volumes:
  todo-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
  sonar-db-data:
  prometheus-data:
  grafana-data:
  influxdb-data:
