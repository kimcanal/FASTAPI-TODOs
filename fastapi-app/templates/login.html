<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>할 일 목록 · 로그인</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='3' width='18' height='18' rx='2' fill='none' stroke='%231E2620' stroke-width='2'/%3E%3Cpath d='M7 12l3 3 7-7' fill='none' stroke='%231E2620' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
    <style>
        :root {
            --paper: #eef0e6;
            --surface: #f8f9f2;
            --ink: #1e2620;
            --muted: #6b7262;
            --rule: #c7d0be;
            --accent: #8c3229;
            --accent-ink: #ffffff;
        }
        * { box-sizing: border-box; }
        body {
            font-family: "Pretendard Variable", "Pretendard", system-ui, -apple-system, "Segoe UI", sans-serif;
            width: 100%;
            max-width: 360px;
            margin-inline: auto;
            margin-block: clamp(1.25rem, 10vh, 4.5rem) 1.5rem;
            padding-inline: clamp(1rem, 4vw, 1.5rem);
            color: var(--ink);
            background:
                repeating-linear-gradient(var(--paper) 0 27px, var(--rule) 27px 28px),
                var(--paper);
            min-height: 100vh;
            min-height: 100svh;
        }
        @media (max-height: 480px) { body { margin-block: 1rem 1.25rem; } }
        :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
        h1 {
            font-family: "Gowun Batang", serif;
            font-weight: 700;
            font-size: clamp(1.2rem, 4vw + .3rem, 1.4rem);
            text-align: center;
            margin: 0 0 1.25rem;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--rule);
            border-radius: 10px;
            padding: 1.5rem;
        }
        form { display: flex; flex-direction: column; gap: .7rem; }
        input[type="text"], input[type="password"] {
            padding: .6rem .75rem;
            border: 1px solid var(--rule);
            border-radius: 6px;
            font-size: 1rem;
            font-family: inherit;
            background: #fff;
            color: var(--ink);
            outline: none;
        }
        input:focus { border-color: var(--ink); box-shadow: 0 0 0 3px rgb(30 38 32 / .1); }
        #register-note { margin: -.2rem 0 0; font-size: .8rem; color: var(--muted); }
        button[type="submit"] {
            border: 1px solid var(--ink);
            border-radius: 6px;
            padding: .65rem 1rem;
            font-size: .95rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            background: var(--ink);
            color: var(--accent-ink);
        }
        button[type="submit"]:hover { background: #343f36; }
        #toggle {
            margin-top: 1rem;
            text-align: center;
            font-size: .85rem;
            color: var(--muted);
        }
        #toggle button {
            border: none;
            background: none;
            color: var(--ink);
            cursor: pointer;
            font-size: .85rem;
            font-family: inherit;
            text-decoration: underline;
            padding: 0;
        }
        #error {
            color: var(--accent);
            background: #fbeceb;
            border: 1px solid var(--accent);
            border-radius: 6px;
            padding: .6rem .75rem;
            margin: 0 0 .8rem;
            font-size: .85rem;
        }
    </style>
</head>
<body>
    <h1>할 일 목록</h1>
    <div class="card">
        <p id="error" role="alert" hidden></p>
        <form id="auth-form">
            <input type="text" id="username" placeholder="학번 (숫자만)" inputmode="numeric" pattern="[0-9]*" required>
            <input type="password" id="password" placeholder="비밀번호 (숫자만)" inputmode="numeric" pattern="[0-9]*" required>
            <p id="register-note" hidden>회원가입 시 초기 비밀번호는 0000으로 설정됩니다. 로그인 후 비밀번호를 바꿀 수 있어요.</p>
            <button type="submit" id="submit-btn">로그인</button>
        </form>
        <div id="toggle">
            계정이 없으신가요? <button type="button" id="toggle-btn">회원가입</button>
        </div>
    </div>
    <script>
        const $ = (id) => document.getElementById(id);
        let mode = "login"; // "login" | "register"

        $("toggle-btn").onclick = () => {
          mode = mode === "login" ? "register" : "login";
          const isRegister = mode === "register";
          $("submit-btn").textContent = isRegister ? "회원가입" : "로그인";
          $("toggle-btn").textContent = isRegister ? "로그인" : "회원가입";
          $("toggle").firstChild.textContent = isRegister ? "이미 계정이 있으신가요? " : "계정이 없으신가요? ";
          $("password").hidden = isRegister;
          $("password").required = !isRegister;
          $("register-note").hidden = !isRegister;
          $("error").hidden = true;
        };

        $("auth-form").onsubmit = async (event) => {
          event.preventDefault();
          const username = $("username").value.trim();
          const payload = mode === "register" ? { username } : { username, password: $("password").value };
          try {
            const res = await fetch(`/auth/${mode}`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });
            if (!res.ok) throw new Error((await res.json()).detail ?? `${res.status}`);
            location.href = "/";
          } catch (e) {
            $("error").textContent = e.message;
            $("error").hidden = false;
          }
        };
    </script>
</body>
</html>
