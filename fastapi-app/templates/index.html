<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
    <style>
        :root {
            --bg-from: #eef2ff;
            --bg-to: #f5f3ff;
            --card: #ffffff;
            --ink: #1f2430;
            --muted: #6b7280;
            --border: #e5e7eb;
            --accent: #6366f1;
            --accent-ink: #ffffff;
            --danger: #ef4444;
            --danger-bg: #fef2f2;
        }
        * { box-sizing: border-box; }
        body {
            font-family: "Pretendard", system-ui, -apple-system, "Segoe UI", sans-serif;
            max-width: 640px;
            margin: 3rem auto;
            padding: 0 1rem;
            color: var(--ink);
            background: linear-gradient(160deg, var(--bg-from), var(--bg-to));
            min-height: 100vh;
        }
        @media (max-width: 480px) {
            body { margin: 1.5rem auto; }
            h1 { font-size: 1.35rem; }
            .card { padding: 1.1rem; border-radius: 12px; }
        }
        h1 {
            font-size: 1.6rem;
            margin: 0 0 1.25rem;
            letter-spacing: -.02rem;
        }
        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 10px 30px -12px rgba(30, 41, 59, .18);
        }
        form { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; }
        input[type="text"] {
            flex: 1 1 12rem;
            padding: .6rem .75rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 1rem;             /* 16px 미만이면 iOS Safari가 포커스 시 자동 확대함 */
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }
        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgb(99 102 241 / .15);
        }
        button {
            border: none;
            border-radius: 10px;
            padding: .6rem 1rem;
            font-size: .9rem;
            cursor: pointer;
            transition: transform .1s, opacity .15s, background .15s;
        }
        button:active { transform: scale(.97); }
        form button[type="submit"] {
            background: var(--accent);
            color: var(--accent-ink);
            font-weight: 600;
        }
        form button[type="submit"]:hover { opacity: .9; }
        #error {
            color: #991b1b;
            background: var(--danger-bg);
            border: 1px solid #fecaca;
            border-radius: 10px;
            padding: .6rem .75rem;
            margin: 0 0 1rem;
            font-size: .875rem;
        }
        #filters {
            display: flex;
            flex-wrap: wrap;
            gap: .4rem;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }
        #filters button[data-filter] {
            background: transparent;
            color: var(--muted);
            padding: .35rem .8rem;
            border-radius: 999px;
        }
        #filters button[data-filter]:hover { background: #f3f4f6; }
        #filters button.active {
            background: var(--accent);
            color: var(--accent-ink);
            font-weight: 600;
        }
        #count {
            color: var(--muted);
            font-size: .85rem;
            margin-left: auto;
        }
        ul { list-style: none; padding: 0; margin: 0; }
        li {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: .5rem .7rem;
            padding: .65rem .25rem;
            border-bottom: 1px solid var(--border);
        }
        li:last-child { border-bottom: none; }
        li input[type="checkbox"] {
            width: 1.15rem;
            height: 1.15rem;
            accent-color: var(--accent);
            cursor: pointer;
            flex: none;
        }
        li span { flex: 1 1 auto; min-width: 8rem; word-break: break-word; }
        .done { text-decoration: line-through; color: var(--muted); }
        li button {
            background: #f3f4f6;
            color: var(--ink);
            font-size: .8rem;
            padding: .5rem .7rem;
            flex: none;
        }
        li button:hover { background: #e5e7eb; }
        li button:last-child {
            background: var(--danger-bg);
            color: var(--danger);
        }
        li button:last-child:hover { background: #fee2e2; }
        li.editing input[type="text"] {
            flex: 1 1 8rem;
            padding: .5rem .6rem;
            font-size: 1rem;
        }
        footer {
            margin-top: 1rem;
            text-align: center;
            font-size: .8rem;
            color: var(--muted);
        }
        footer a { color: var(--accent); text-decoration: none; }
        footer a:hover { text-decoration: underline; }
        #user-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: .6rem;
            margin-bottom: .5rem;
            font-size: .85rem;
            color: var(--muted);
        }
        #user-bar button {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            padding: .3rem .7rem;
            font-size: .8rem;
        }
        #user-bar button:hover { background: #f3f4f6; }
    </style>
</head>
<body>
    <div id="user-bar">
        <span id="username-info"></span>
        <button type="button" id="logout-btn">로그아웃</button>
    </div>
    <h1>📝 To-Do List</h1>
    <div class="card">
        <form id="todo-form">
            <input type="text" id="title" placeholder="제목 (예: 20231234)" required>
            <input type="text" id="description" placeholder="설명 (예: 홍길동)">
            <button type="submit">추가</button>
        </form>
        <p id="error" role="alert" hidden></p>
        <div id="filters">
            <button data-filter="all" class="active">전체</button>
            <button data-filter="active">진행중</button>
            <button data-filter="completed">완료</button>
            <span id="count"></span>
        </div>
        <ul id="todo-list"></ul>
    </div>
    <footer>
        <span id="version-info">버전 확인 중…</span>
        · <a href="/release-notes">릴리스 노트</a>
    </footer>
    <script>
        const $ = (id) => document.getElementById(id);
        const listEl = $("todo-list"), errorEl = $("error"), countEl = $("count");
        let allTodos = [];
        let filter = "all";
        let editingId = null;

        // 모든 요청을 한 곳에서 처리하고, 실패는 조용히 넘기지 않는다
        async function api(url, method = "GET", body) {
          const res = await fetch(url, body
            ? { method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }
            : { method });
          if (res.status === 401) {
            location.href = "/login";
            throw new Error("로그인이 필요합니다");
          }
          if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
          return res.status === 204 ? null : res.json();
        }

        // 작업을 실행하고, 실패하면 화면에 이유를 띄운다
        async function run(what, job) {
          try {
            await job();
            errorEl.hidden = true;
          } catch (e) {
            errorEl.textContent = `${what} 실패: ${e.message}`;
            errorEl.hidden = false;
          }
        }

        const load = () => run("목록 불러오기", async () => { allTodos = await api("/todos"); render(); });
        const save = (id, todo) => run("수정", async () => { await api(`/todos/${id}`, "PUT", todo); await load(); });

        function button(label, onclick) {
          return Object.assign(document.createElement("button"), { textContent: label, onclick });
        }

        function setFilter(next) {
          filter = next;
          for (const btn of document.querySelectorAll("#filters button[data-filter]")) {
            btn.classList.toggle("active", btn.dataset.filter === filter);
          }
          render();
        }

        for (const btn of document.querySelectorAll("#filters button[data-filter]")) {
          btn.onclick = () => setFilter(btn.dataset.filter);
        }

        function render() {
          const todos = allTodos.filter((todo) => {
            if (filter === "active") return !todo.completed;
            if (filter === "completed") return todo.completed;
            return true;
          });
          countEl.textContent = `${allTodos.filter((t) => !t.completed).length}개 남음`;
          listEl.replaceChildren(...todos.map((todo) => {
            const li = document.createElement("li");

            if (todo.id === editingId) {
              li.className = "editing";
              const titleInput = Object.assign(document.createElement("input"), {
                type: "text", value: todo.title, className: "edit-title",
              });
              const descInput = Object.assign(document.createElement("input"), {
                type: "text", value: todo.description, className: "edit-description",
              });
              const onKey = (e) => {
                if (e.key === "Enter") submitEdit(todo, li);
                if (e.key === "Escape") cancelEdit();
              };
              titleInput.onkeydown = descInput.onkeydown = onKey;
              li.append(titleInput, descInput, button("저장", () => submitEdit(todo, li)), button("취소", cancelEdit));
              return li;
            }

            const check = Object.assign(document.createElement("input"), {
              type: "checkbox",
              checked: todo.completed,
              onchange: () => save(todo.id, { ...todo, completed: check.checked }),
            });
            const text = Object.assign(document.createElement("span"), {
              textContent: `${todo.title} — ${todo.description}`,
              className: todo.completed ? "done" : "",
            });
            li.append(check, text, button("수정", () => startEdit(todo.id)), button("삭제", () => remove(todo.id)));
            return li;
          }));

          if (editingId !== null) listEl.querySelector(".edit-title")?.focus();
        }

        function startEdit(id) {
          editingId = id;
          render();
        }

        function cancelEdit() {
          editingId = null;
          render();
        }

        function submitEdit(todo, li) {
          const title = li.querySelector(".edit-title").value.trim();
          if (!title) {
            errorEl.textContent = "수정 실패: 제목은 공백만으로 입력할 수 없습니다";
            errorEl.hidden = false;
            return;
          }
          const description = li.querySelector(".edit-description").value.trim();
          editingId = null;
          save(todo.id, { ...todo, title, description });
        }

        function remove(id) {
          if (!confirm("정말 삭제할까요?")) return;
          run("삭제", async () => { await api(`/todos/${id}`, "DELETE"); await load(); });
        }

        $("todo-form").onsubmit = (event) => {
          event.preventDefault();
          const title = $("title").value.trim();
          if (!title) {
            errorEl.textContent = "추가 실패: 제목은 공백만으로 입력할 수 없습니다";
            errorEl.hidden = false;
            return;
          }
          run("추가", async () => {
            await api("/todos", "POST", { title, description: $("description").value.trim() });
            event.target.reset();
            await load();
          });
        };

        async function loadVersion() {
          try {
            const info = await api("/api/version");
            $("version-info").textContent = `v${info.version} (${info.commit} · build ${info.build})`;
          } catch {
            $("version-info").textContent = "버전 정보를 불러올 수 없습니다";
          }
        }

        async function loadUser() {
          try {
            const info = await api("/auth/me");
            $("username-info").textContent = `${info.username}님`;
          } catch {
            // api()가 401이면 이미 /login으로 이동시킨다
          }
        }

        $("logout-btn").onclick = () => run("로그아웃", async () => {
          await api("/auth/logout", "POST");
          location.href = "/login";
        });

        load();
        loadVersion();
        loadUser();
    </script>
</body>
</html>
