<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>할 일 목록</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='3' width='18' height='18' rx='2' fill='none' stroke='%231E2620' stroke-width='2'/%3E%3Cpath d='M7 12l3 3 7-7' fill='none' stroke='%231E2620' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
    <style>
        :root {
            --paper: #eef0e6;
            --surface: #f8f9f2;
            --ink: #1e2620;
            --muted: #6b7262;
            --rule: #c7d0be;
            --accent: #8c3229;
            --accent-ink: #ffffff;
            --done: #3f6b4a;
            --done-bg: #e3ead4;
        }
        * { box-sizing: border-box; }
        html { background: var(--paper); }
        body {
            font-family: "Pretendard Variable", "Pretendard", system-ui, -apple-system, "Segoe UI", sans-serif;
            width: 100%;
            max-width: 640px;
            margin-inline: auto;
            margin-block: clamp(1rem, 5vh, 2.5rem) 2rem;
            padding-inline: clamp(1rem, 4vw, 1.5rem);
            color: var(--ink);
            background:
                repeating-linear-gradient(var(--paper) 0 27px, var(--rule) 27px 28px),
                var(--paper);
            min-height: 100vh;
            min-height: 100svh;      /* 모바일 주소창이 접히고 펼쳐져도 높이가 들썩이지 않게 */
            line-height: 1.5;
        }
        /* 가로모드(랜드스케이프) 등 세로 공간이 좁을 때는 위아래 여백을 더 줄인다 */
        @media (max-height: 480px) {
            body { margin-block: 1rem 1.25rem; }
        }
        a { color: var(--ink); }
        :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
        h1 {
            font-family: "Gowun Batang", serif;
            font-size: clamp(1.3rem, 4vw + .5rem, 1.55rem);
            font-weight: 700;
            margin: 0 0 1.25rem;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--rule);
            border-radius: 10px;
            padding: clamp(1rem, 4vw, 1.4rem) clamp(1.1rem, 4vw, 1.5rem);
        }
        form { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; }
        input[type="text"] {
            flex: 1 1 12rem;
            padding: .6rem .75rem;
            border: 1px solid var(--rule);
            border-radius: 6px;
            font-size: 1rem;             /* 16px 미만이면 iOS Safari가 포커스 시 자동 확대함 */
            outline: none;
            background: #fff;
            color: var(--ink);
            font-family: inherit;
            transition: border-color .15s, box-shadow .15s;
        }
        input[type="text"]:focus {
            border-color: var(--ink);
            box-shadow: 0 0 0 3px rgb(30 38 32 / .1);
        }
        select, input[type="date"] {
            padding: .6rem .6rem;
            border: 1px solid var(--rule);
            border-radius: 6px;
            font-size: .9rem;
            font-family: inherit;
            background: #fff;
            color: var(--ink);
            outline: none;
        }
        select:focus, input[type="date"]:focus {
            border-color: var(--ink);
            box-shadow: 0 0 0 3px rgb(30 38 32 / .1);
        }
        #search { flex: 1 1 8rem; }
        #celebrate {
            background: var(--done-bg);
            color: var(--done);
            border: 1px solid var(--done);
            border-radius: 6px;
            padding: .6rem .75rem;
            margin: 0 0 1rem;
            font-size: .875rem;
            font-weight: 600;
        }
        .badge {
            font-size: .75rem;
            padding: .15rem .5rem;
            border-radius: 4px;
            border: 1px solid var(--rule);
            color: var(--muted);
            flex: none;
        }
        .badge.overdue { border-color: var(--accent); color: var(--accent); font-weight: 600; }
        .todo-title { font-weight: 500; }
        .todo-desc {
            flex-basis: 100%;
            color: var(--ink);              /* 연한 회색(--muted)은 대비가 낮아 읽기 불편해서 본문과 같은 잉크색으로 */
            opacity: .75;                   /* 대신 제목보다 살짝 흐리게만 — 구분은 되지만 읽는 덴 지장 없게 */
            font-size: .9rem;
            margin-left: calc(.75rem + 1.1rem);   /* 체크박스 폭만큼 들여써서 제목 밑에 달린 설명처럼 보이게 */
        }
        .todo-desc.done { opacity: 1; }     /* .done이 이미 색을 muted로 바꾸므로 흐림 효과는 끔 */
        button {
            border: 1px solid var(--rule);
            border-radius: 6px;
            background: #fff;
            color: var(--ink);
            padding: .55rem 1rem;
            font-size: .9rem;
            font-family: inherit;
            cursor: pointer;
            transition: background .15s, border-color .15s;
        }
        button:hover { background: var(--paper); }
        form button[type="submit"] {
            background: var(--ink);
            border-color: var(--ink);
            color: var(--accent-ink);
            font-weight: 600;
        }
        form button[type="submit"]:hover { background: #343f36; }
        #error, .field-error {
            color: var(--accent);
            background: #fbeceb;
            border: 1px solid var(--accent);
            border-radius: 6px;
            padding: .6rem .75rem;
            margin: 0 0 1rem;
            font-size: .875rem;
        }
        .field-success {
            color: var(--done);
            background: var(--done-bg);
            border: 1px solid var(--done);
            border-radius: 6px;
            padding: .6rem .75rem;
            margin: 0 0 1rem;
            font-size: .875rem;
        }
        #filters {
            display: flex;
            flex-wrap: wrap;
            gap: .4rem;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--rule);
        }
        #filters button[data-filter] {
            background: transparent;
            border-color: transparent;
            color: var(--muted);
            padding: .35rem .75rem;
        }
        #filters button[data-filter]:hover { border-color: var(--rule); }
        #filters button.active {
            background: var(--ink);
            border-color: var(--ink);
            color: var(--accent-ink);
            font-weight: 600;
        }
        #count {
            color: var(--muted);
            font-size: .85rem;
            margin-left: auto;
        }
        ul { list-style: none; padding: 0; margin: 0; }
        li {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: .5rem .7rem;
            padding: .65rem .25rem .65rem .5rem;
            border-bottom: 1px solid var(--rule);
            border-left: 3px solid transparent;   /* 중요 항목일 때만 priority-high로 색이 채워짐 */
        }
        li:last-child { border-bottom: none; }
        li.priority-high { border-left-color: var(--accent); }
        li.todo-group-heading {
            display: block;
            border-left: none;
            border-bottom: none;
            padding: .9rem .25rem .3rem;
            font-family: "Gowun Batang", serif;
            font-size: .95rem;
            color: var(--muted);
        }
        li.todo-group-heading:first-child { padding-top: 0; }
        li input[type="checkbox"] {
            width: 1.1rem;
            height: 1.1rem;
            accent-color: var(--ink);
            flex: none;
        }
        li span { flex: 1 1 auto; min-width: 8rem; word-break: break-word; }
        .done { text-decoration: line-through; color: var(--muted); }
        li button {
            font-size: .8rem;
            padding: .45rem .7rem;
            flex: none;
        }
        li button:last-child {
            color: var(--accent);
            border-color: var(--accent);
        }
        li button:last-child:hover { background: #fbeceb; }
        li.editing input[type="text"] {
            flex: 1 1 8rem;
            padding: .5rem .6rem;
            font-size: 1rem;
        }
        footer {
            margin-top: 1rem;
            text-align: center;
            font-size: .8rem;
            color: var(--muted);
        }
        footer a { text-decoration: underline; }
        #user-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: .6rem;
            margin-bottom: .5rem;
            font-size: .85rem;
            color: var(--muted);
        }
        #user-bar button {
            background: transparent;
            border: 1px solid var(--rule);
            color: var(--muted);
            padding: .3rem .7rem;
            font-size: .8rem;
        }
        #user-bar button:hover { background: var(--surface); }
        #undo-toast {
            position: fixed;
            left: 50%;
            bottom: 1.5rem;
            transform: translateX(-50%);
            align-items: center;
            gap: .75rem;
            background: var(--ink);
            color: var(--surface);
            padding: .7rem 1rem;
            border-radius: 8px;
            font-size: .9rem;
            z-index: 10;
        }
        #undo-toast:not([hidden]) { display: flex; }
        #undo-toast button {
            background: transparent;
            border: 1px solid var(--surface);
            color: var(--surface);
            font-weight: 600;
            padding: .4rem .8rem;
        }
        #undo-toast button:hover { background: #343f36; }
        #trash-card { margin-top: 1rem; }
        #trash-header {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: .5rem 1rem;
            margin-bottom: .75rem;
            padding-bottom: .75rem;
            border-bottom: 1px solid var(--rule);
        }
        #trash-header h2 { font-family: "Gowun Batang", serif; font-size: 1.05rem; margin: 0; }
        #trash-header p { margin: 0; font-size: .8rem; color: var(--muted); flex: 1 1 14rem; }
        #trash-empty { color: var(--muted); font-size: .9rem; padding: .5rem .25rem; }
        #trash-list li span.trash-meta { flex: none; font-size: .78rem; color: var(--muted); }
        #csv-tools {
            display: flex;
            gap: .5rem;
            margin-bottom: .75rem;
        }
        #csv-tools button, #csv-tools label {
            background: transparent;
            border: 1px solid var(--rule);
            color: var(--muted);
            padding: .35rem .75rem;
            border-radius: 6px;
            font-size: .8rem;
            cursor: pointer;
        }
        #csv-tools button:hover, #csv-tools label:hover { background: var(--paper); }
        #account-card { margin-top: 1rem; }
        #account-card h2 { font-family: "Gowun Batang", serif; font-size: 1.05rem; margin: 0 0 1rem; }
        #password-form { flex-direction: column; }
        #password-form input { width: 100%; }
        #friends-card { margin-top: 1rem; }
        #add-friend-intro { margin: 0 0 .75rem; font-size: .85rem; color: var(--muted); }
        #add-friend-form { margin-bottom: 1rem; }
        #friend-list li span.friend-name { font-weight: 600; }
        #friend-todos-header {
            display: flex;
            align-items: center;
            gap: .5rem;
            margin-bottom: .75rem;
            padding-bottom: .75rem;
            border-bottom: 1px solid var(--rule);
        }
        #friend-todos-header h2 { font-family: "Gowun Batang", serif; font-size: 1.05rem; margin: 0; flex: 1; }
        #friend-empty { color: var(--muted); font-size: .9rem; padding: .5rem .25rem; }
        #friend-todo-list li { flex-direction: column; align-items: stretch; }
        #friend-todo-list .friend-todo-main {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: .5rem .7rem;
            width: 100%;
        }
        .reaction-bar {
            display: flex;
            flex-wrap: wrap;
            gap: .3rem;
            margin-top: .4rem;
        }
        .reaction-bar button {
            padding: .3rem .55rem;
            font-size: .95rem;
            line-height: 1;
        }
        .reaction-bar button.picked {
            background: var(--ink);
            border-color: var(--ink);
        }
        .reaction-bar .reaction-count {
            font-size: .7rem;
            color: var(--muted);
            margin-left: .15rem;
        }
        .reaction-bar button.picked .reaction-count { color: var(--surface); }
    </style>
</head>
<body>
    <div id="user-bar">
        <span id="streak-info"></span>
        <span id="username-info"></span>
        <button type="button" id="friends-toggle-btn">친구</button>
        <button type="button" id="trash-toggle-btn">휴지통</button>
        <button type="button" id="account-toggle-btn">계정</button>
        <button type="button" id="logout-btn">로그아웃</button>
    </div>
    <h1>할 일 목록</h1>
    <div class="card">
        <form id="todo-form">
            <input type="text" id="title" placeholder="제목 (예: 20231234)" required>
            <input type="text" id="description" placeholder="설명 (예: 홍길동)">
            <select id="priority">
                <option value="normal">보통</option>
                <option value="high">중요</option>
            </select>
            <input type="date" id="due-date">
            <button type="submit">추가</button>
        </form>
        <p id="error" role="alert" hidden></p>
        <p id="celebrate" hidden>오늘 할 일을 모두 완료했습니다.</p>
        <div id="filters">
            <button data-filter="all" class="active">전체</button>
            <button data-filter="active">진행중</button>
            <button data-filter="completed">완료</button>
            <input type="text" id="search" placeholder="검색">
            <span id="count"></span>
        </div>
        <div id="csv-tools">
            <button type="button" id="export-btn">CSV 내보내기</button>
            <label id="import-label" for="import-input">CSV 가져오기</label>
            <input type="file" id="import-input" accept=".csv,text/csv" hidden>
        </div>
        <ul id="todo-list"></ul>
    </div>
    <div class="card" id="trash-card" hidden>
        <div id="trash-header">
            <h2>휴지통</h2>
            <p>삭제한 할 일은 7일 동안 보관되고, 그 전에 복원하지 않으면 자동으로 완전히 삭제됩니다. 복원하면 미완료 상태로 돌아옵니다.</p>
            <button type="button" id="trash-close-btn">닫기</button>
        </div>
        <p id="trash-empty" hidden>휴지통이 비어 있어요.</p>
        <ul id="trash-list"></ul>
    </div>
    <div class="card" id="friends-card" hidden>
        <div id="friend-list-view">
            <p id="add-friend-intro">친구의 학번을 입력하면 추가돼요.</p>
            <form id="add-friend-form">
                <input type="text" id="friend-username-input" placeholder="친구 학번 입력" inputmode="numeric" pattern="[0-9]*" required>
                <button type="submit">추가</button>
            </form>
            <p id="friend-error" class="field-error" role="alert" hidden></p>
            <p id="friend-empty" hidden>아직 친구가 없어요. 학번으로 추가해보세요.</p>
            <ul id="friend-list"></ul>
        </div>
        <div id="friend-todos-view" hidden>
            <div id="friend-todos-header">
                <h2 id="friend-todos-title"></h2>
                <button type="button" id="friend-back-btn">← 목록으로</button>
            </div>
            <ul id="friend-todo-list"></ul>
        </div>
    </div>
    <div class="card" id="account-card" hidden>
        <h2>비밀번호 변경</h2>
        <p id="password-error" class="field-error" role="alert" hidden></p>
        <p id="password-success" class="field-success" hidden>비밀번호를 변경했습니다.</p>
        <form id="password-form">
            <input type="password" id="old-password" placeholder="현재 비밀번호" inputmode="numeric" pattern="[0-9]*" required>
            <input type="password" id="new-password" placeholder="새 비밀번호 (숫자만)" inputmode="numeric" pattern="[0-9]*" required>
            <input type="password" id="new-password-confirm" placeholder="새 비밀번호 확인" inputmode="numeric" pattern="[0-9]*" required>
            <button type="submit">변경</button>
        </form>
    </div>
    <div id="undo-toast" hidden></div>
    <footer>
        <span id="version-info">버전 확인 중…</span>
        · <a href="/release-notes">릴리스 노트</a>
    </footer>
    <script>
        const $ = (id) => document.getElementById(id);
        const listEl = $("todo-list"), errorEl = $("error"), countEl = $("count");
        const celebrateEl = $("celebrate");
        let allTodos = [];
        let filter = "all";
        let search = "";
        let editingId = null;

        const PRIORITY_LABEL = { high: "중요", normal: "보통" };

        function formatDueDate(dueDate, completed) {
          if (!dueDate) return null;
          const isOverdue = !completed && dueDate < new Date().toISOString().slice(0, 10);
          return { text: `${dueDate}${isOverdue ? " (지남)" : ""}`, overdue: isOverdue };
        }

        // 마감일을 매번 직접 고르지 않아도 되게, 추가 폼의 기본값을 오늘 날짜로 채워둔다
        function setDefaultDueDate() {
          $("due-date").value = new Date().toISOString().slice(0, 10);
        }

        // 제목/설명을 한 문자열로 이어붙이지 않고 각각 별도 요소로 렌더링한다.
        // 우선순위는 텍스트 배지 대신, 할 일 목록(Todoist/TickTick 등)에서 흔한
        // "행 왼쪽의 색상 띠"로 표시한다 — 매 줄에 "보통"이라고 반복해서 적지 않아도 되고,
        // 중요한 항목만 한눈에 스캔하기 쉽다 (markTodoLi에서 li에 클래스를 붙임)
        function markTodoLi(li, todo) {
          li.classList.toggle("priority-high", todo.priority === "high");
        }

        function todoContentNodes(todo) {
          const doneClass = todo.completed ? " done" : "";
          const nodes = [
            Object.assign(document.createElement("span"), {
              textContent: todo.title,
              className: `todo-title${doneClass}`,
            }),
          ];
          if (todo.description) {
            nodes.push(Object.assign(document.createElement("span"), {
              textContent: todo.description,
              className: `todo-desc${doneClass}`,
            }));
          }
          return nodes;
        }

        // 모든 요청을 한 곳에서 처리하고, 실패는 조용히 넘기지 않는다
        async function api(url, method = "GET", body) {
          const res = await fetch(url, body
            ? { method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }
            : { method });
          if (res.status === 401) {
            location.href = "/login";
            throw new Error("로그인이 필요합니다");
          }
          if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
          return res.status === 204 ? null : res.json();
        }

        // 작업을 실행하고, 실패하면 화면에 이유를 띄운다
        async function run(what, job) {
          try {
            await job();
            errorEl.hidden = true;
          } catch (e) {
            errorEl.textContent = `${what} 실패: ${e.message}`;
            errorEl.hidden = false;
          }
        }

        const load = () => run("목록 불러오기", async () => { allTodos = await api("/todos"); render(); });
        const save = (id, todo) => run("수정", async () => { await api(`/todos/${id}`, "PUT", todo); await load(); await loadStats(); });

        function button(label, onclick) {
          return Object.assign(document.createElement("button"), { textContent: label, onclick });
        }

        function setFilter(next) {
          filter = next;
          for (const btn of document.querySelectorAll("#filters button[data-filter]")) {
            btn.classList.toggle("active", btn.dataset.filter === filter);
          }
          render();
        }

        for (const btn of document.querySelectorAll("#filters button[data-filter]")) {
          btn.onclick = () => setFilter(btn.dataset.filter);
        }

        $("search").oninput = (e) => { search = e.target.value; render(); };

        // 정렬 옵션을 따로 두지 않고, 중요가 항상 위 / 각 그룹 안에서는 마감일이 빠른 순으로 고정한다
        function byDueDateAsc(a, b) {
          return (a.due_date ?? "9999").localeCompare(b.due_date ?? "9999");
        }

        function buildEditingLi(todo) {
          const li = document.createElement("li");
          li.className = "editing";
          const titleInput = Object.assign(document.createElement("input"), {
            type: "text", value: todo.title, className: "edit-title",
          });
          const descInput = Object.assign(document.createElement("input"), {
            type: "text", value: todo.description, className: "edit-description",
          });
          const priorityInput = Object.assign(document.createElement("select"), { className: "edit-priority" });
          for (const [value, label] of Object.entries(PRIORITY_LABEL)) {
            priorityInput.append(new Option(label, value, false, todo.priority === value));
          }
          const dueDateInput = Object.assign(document.createElement("input"), {
            type: "date", value: todo.due_date ?? "", className: "edit-due-date",
          });
          const onKey = (e) => {
            if (e.key === "Enter") submitEdit(todo, li);
            if (e.key === "Escape") cancelEdit();
          };
          titleInput.onkeydown = descInput.onkeydown = onKey;
          li.append(
            titleInput, descInput, priorityInput, dueDateInput,
            button("저장", () => submitEdit(todo, li)), button("취소", cancelEdit),
          );
          return li;
        }

        function buildTodoLi(todo) {
          if (todo.id === editingId) return buildEditingLi(todo);

          const li = document.createElement("li");
          const check = Object.assign(document.createElement("input"), {
            type: "checkbox",
            checked: todo.completed,
            onchange: () => save(todo.id, { ...todo, completed: check.checked }),
          });
          markTodoLi(li, todo);
          li.append(check, ...todoContentNodes(todo));
          const due = formatDueDate(todo.due_date, todo.completed);
          if (due) {
            li.append(Object.assign(document.createElement("span"), {
              textContent: due.text,
              className: due.overdue ? "badge overdue" : "badge",
            }));
          }
          // 친구가 남긴 반응 — 본인은 누를 수 없으니 읽기 전용 배지로만 보여준다
          for (const [emoji, count] of Object.entries(todo.reaction_counts)) {
            if (count === 0) continue;
            li.append(Object.assign(document.createElement("span"), {
              className: "badge",
              textContent: `${emoji} ${count}`,
            }));
          }
          li.append(button("수정", () => startEdit(todo.id)), button("삭제", () => remove(todo.id)));
          return li;
        }

        function groupHeadingLi(label) {
          return Object.assign(document.createElement("li"), {
            textContent: label,
            className: "todo-group-heading",
          });
        }

        function render() {
          const todos = allTodos.filter((todo) => {
            if (filter === "active" && todo.completed) return false;
            if (filter === "completed" && !todo.completed) return false;
            const needle = search.trim().toLowerCase();
            if (!needle) return true;
            return todo.title.toLowerCase().includes(needle) || todo.description.toLowerCase().includes(needle);
          });
          countEl.textContent = `오늘 남은 일들은 ${allTodos.filter((t) => !t.completed).length}개입니다.`;
          celebrateEl.hidden = !(allTodos.length > 0 && allTodos.every((t) => t.completed));

          const groups = [
            { label: "중요", todos: todos.filter((t) => t.priority === "high").sort(byDueDateAsc) },
            { label: "보통", todos: todos.filter((t) => t.priority === "normal").sort(byDueDateAsc) },
          ];
          const children = [];
          for (const group of groups) {
            if (group.todos.length === 0) continue;
            children.push(groupHeadingLi(group.label));
            children.push(...group.todos.map(buildTodoLi));
          }
          listEl.replaceChildren(...children);

          if (editingId !== null) listEl.querySelector(".edit-title")?.focus();
        }

        function startEdit(id) {
          editingId = id;
          render();
        }

        function cancelEdit() {
          editingId = null;
          render();
        }

        function submitEdit(todo, li) {
          const title = li.querySelector(".edit-title").value.trim();
          if (!title) {
            errorEl.textContent = "수정 실패: 제목은 공백만으로 입력할 수 없습니다";
            errorEl.hidden = false;
            return;
          }
          const description = li.querySelector(".edit-description").value.trim();
          const priority = li.querySelector(".edit-priority").value;
          const dueDate = li.querySelector(".edit-due-date").value || null;
          editingId = null;
          save(todo.id, { ...todo, title, description, priority, due_date: dueDate });
        }

        const UNDO_SECONDS = 5;
        const TRASH_RETENTION_DAYS = 7;
        let undoTimer = null;
        let trashedTodos = [];

        function hideUndoToast() {
          clearTimeout(undoTimer);
          undoTimer = null;
          $("undo-toast").hidden = true;
        }

        function showUndoToast(id) {
          clearTimeout(undoTimer);
          const toast = $("undo-toast");
          toast.replaceChildren(
            Object.assign(document.createElement("span"), { textContent: "할 일을 휴지통으로 보냈어요." }),
            button("실행취소", () => { hideUndoToast(); restoreTodo(id); }),
          );
          toast.hidden = false;
          undoTimer = setTimeout(hideUndoToast, UNDO_SECONDS * 1000);
        }

        function showMessageToast(text, seconds = 4) {
          clearTimeout(undoTimer);
          const toast = $("undo-toast");
          toast.replaceChildren(Object.assign(document.createElement("span"), { textContent: text }));
          toast.hidden = false;
          undoTimer = setTimeout(hideUndoToast, seconds * 1000);
        }

        // 휴지통 패널(열려 있으면)과 본 목록을 함께 갱신하며 할 일을 복원한다 (복원 시 항상 미완료로 돌아옴)
        function restoreTodo(id) {
          return run("복원", async () => {
            await api(`/todos/${id}/restore`, "POST");
            await load();
            await loadStats();
            if (!$("trash-card").hidden) await loadTrash();
          });
        }

        function remove(id) {
          run("삭제", async () => {
            await api(`/todos/${id}`, "DELETE");
            await load();
            await loadStats();
            showUndoToast(id);
            if (!$("trash-card").hidden) await loadTrash();
          });
        }

        function daysLeftInTrash(deletedAt) {
          const msLeft = new Date(deletedAt).getTime() + TRASH_RETENTION_DAYS * 86400000 - Date.now();
          return Math.max(0, Math.ceil(msLeft / 86400000));
        }

        async function loadTrash() {
          await run("휴지통 불러오기", async () => {
            trashedTodos = await api("/todos/trash");
            renderTrash();
          });
        }

        function renderTrash() {
          $("trash-empty").hidden = trashedTodos.length > 0;
          $("trash-list").replaceChildren(...trashedTodos.map((todo) => {
            const li = document.createElement("li");
            const meta = Object.assign(document.createElement("span"), {
              className: "trash-meta",
              textContent: `${daysLeftInTrash(todo.deleted_at)}일 후 완전 삭제`,
            });
            markTodoLi(li, todo);
            li.append(...todoContentNodes(todo), meta, button("복원", () => restoreTodo(todo.id)));
            return li;
          }));
        }

        $("trash-toggle-btn").onclick = () => { $("trash-card").hidden = false; loadTrash(); };
        $("trash-close-btn").onclick = () => { $("trash-card").hidden = true; };

        $("export-btn").onclick = () => { window.location.href = "/todos/export"; };

        $("import-input").onchange = (event) => {
          const file = event.target.files[0];
          event.target.value = "";   // 같은 파일을 다시 선택해도 change 이벤트가 또 일어나도록
          if (!file) return;
          run("CSV 가져오기", async () => {
            const formData = new FormData();
            formData.append("file", file);
            const res = await fetch("/todos/import", { method: "POST", body: formData });
            if (res.status === 401) { location.href = "/login"; throw new Error("로그인이 필요합니다"); }
            if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
            const result = await res.json();
            await load();
            await loadStats();
            showMessageToast(`CSV에서 ${result.added}개 추가했어요 (건너뜀 ${result.skipped}개)`);
          });
        };

        $("todo-form").onsubmit = (event) => {
          event.preventDefault();
          const title = $("title").value.trim();
          if (!title) {
            errorEl.textContent = "추가 실패: 제목은 공백만으로 입력할 수 없습니다";
            errorEl.hidden = false;
            return;
          }
          run("추가", async () => {
            await api("/todos", "POST", {
              title,
              description: $("description").value.trim(),
              priority: $("priority").value,
              due_date: $("due-date").value || null,
            });
            event.target.reset();
            setDefaultDueDate();
            await load();
            await loadStats();
          });
        };

        async function loadStats() {
          try {
            const info = await api("/stats");
            $("streak-info").textContent = info.streak > 0 ? `${info.streak}일 연속 완료` : "";
          } catch {
            $("streak-info").textContent = "";
          }
        }

        async function loadVersion() {
          try {
            const info = await api("/api/version");
            $("version-info").textContent = `v${info.version} (${info.commit} · build ${info.build})`;
          } catch {
            $("version-info").textContent = "버전 정보를 불러올 수 없습니다";
          }
        }

        async function loadUser() {
          try {
            const info = await api("/auth/me");
            $("username-info").textContent = `${info.username}님`;
          } catch {
            // api()가 401이면 이미 /login으로 이동시킨다
          }
        }

        $("logout-btn").onclick = () => run("로그아웃", async () => {
          await api("/auth/logout", "POST");
          location.href = "/login";
        });

        // ── 친구 ──
        const REACTION_EMOJI = ["👍", "❤️", "🔥", "😂", "😮", "👏"];
        let friends = [];
        let currentFriend = null;

        function showFriendListView() {
          currentFriend = null;
          $("friend-list-view").hidden = false;
          $("friend-todos-view").hidden = true;
        }

        async function loadFriends() {
          await run("친구 목록 불러오기", async () => {
            friends = await api("/friends");
            renderFriendList();
          });
        }

        function renderFriendList() {
          $("friend-empty").hidden = friends.length > 0;
          $("friend-list").replaceChildren(...friends.map((friend) => {
            const li = document.createElement("li");
            const name = Object.assign(document.createElement("span"), {
              textContent: friend.username, className: "friend-name",
            });
            li.append(
              name,
              button("할 일 보기", () => openFriendTodos(friend)),
              button("삭제", () => removeFriend(friend)),
            );
            return li;
          }));
        }

        function removeFriend(friend) {
          run("친구 삭제", async () => {
            await api(`/friends/${friend.id}`, "DELETE");
            await loadFriends();
          });
        }

        function openFriendTodos(friend) {
          currentFriend = friend;
          $("friend-todos-title").textContent = `${friend.username}님의 할 일`;
          $("friend-list-view").hidden = true;
          $("friend-todos-view").hidden = false;
          loadFriendTodos();
        }

        async function loadFriendTodos() {
          if (!currentFriend) return;
          await run("친구 할 일 불러오기", async () => {
            const todos = await api(`/friends/${currentFriend.id}/todos`);
            renderFriendTodos(todos);
          });
        }

        function buildFriendTodoLi(todo) {
          const li = document.createElement("li");
          markTodoLi(li, todo);
          const main = document.createElement("div");
          main.className = "friend-todo-main";
          main.append(...todoContentNodes(todo));
          const due = formatDueDate(todo.due_date, todo.completed);
          if (due) {
            main.append(Object.assign(document.createElement("span"), {
              textContent: due.text,
              className: due.overdue ? "badge overdue" : "badge",
            }));
          }
          const reactionBar = document.createElement("div");
          reactionBar.className = "reaction-bar";
          for (const emoji of REACTION_EMOJI) {
            const count = todo.reaction_counts[emoji] ?? 0;
            const btn = button(count ? `${emoji}` : emoji, () => toggleReaction(todo.id, emoji));
            if (todo.my_reaction === emoji) btn.classList.add("picked");
            if (count) btn.append(Object.assign(document.createElement("span"), {
              textContent: count, className: "reaction-count",
            }));
            reactionBar.append(btn);
          }
          li.append(main, reactionBar);
          return li;
        }

        function renderFriendTodos(todos) {
          const groups = [
            { label: "중요", todos: todos.filter((t) => t.priority === "high").sort(byDueDateAsc) },
            { label: "보통", todos: todos.filter((t) => t.priority === "normal").sort(byDueDateAsc) },
          ];
          const children = [];
          for (const group of groups) {
            if (group.todos.length === 0) continue;
            children.push(groupHeadingLi(group.label));
            children.push(...group.todos.map(buildFriendTodoLi));
          }
          $("friend-todo-list").replaceChildren(...children);
        }

        function toggleReaction(todoId, emoji) {
          run("반응 남기기", async () => {
            await api(`/todos/${todoId}/reactions`, "POST", { emoji });
            await loadFriendTodos();
          });
        }

        $("friends-toggle-btn").onclick = () => {
          const show = $("friends-card").hidden;
          $("friends-card").hidden = !show;
          if (show) { showFriendListView(); loadFriends(); }
        };
        $("friend-back-btn").onclick = showFriendListView;

        $("add-friend-form").onsubmit = (event) => {
          event.preventDefault();
          const input = $("friend-username-input");
          const username = input.value.trim();
          if (!username) return;
          (async () => {
            try {
              await api("/friends", "POST", { username });
              $("friend-error").hidden = true;
              input.value = "";
              await loadFriends();
            } catch (e) {
              $("friend-error").textContent = `친구 추가 실패: ${e.message}`;
              $("friend-error").hidden = false;
            }
          })();
        };

        // ── 계정 ──
        $("account-toggle-btn").onclick = () => {
          $("account-card").hidden = !$("account-card").hidden;
        };

        $("password-form").onsubmit = (event) => {
          event.preventDefault();
          const oldPassword = $("old-password").value;
          const newPassword = $("new-password").value;
          const confirmPassword = $("new-password-confirm").value;
          $("password-error").hidden = true;
          $("password-success").hidden = true;
          if (newPassword !== confirmPassword) {
            $("password-error").textContent = "새 비밀번호가 서로 다릅니다";
            $("password-error").hidden = false;
            return;
          }
          (async () => {
            try {
              await api("/auth/password", "POST", { old_password: oldPassword, new_password: newPassword });
              event.target.reset();
              $("password-success").hidden = false;
            } catch (e) {
              $("password-error").textContent = `비밀번호 변경 실패: ${e.message}`;
              $("password-error").hidden = false;
            }
          })();
        };

        setDefaultDueDate();
        load();
        loadVersion();
        loadUser();
        loadStats();
    </script>
</body>
</html>
