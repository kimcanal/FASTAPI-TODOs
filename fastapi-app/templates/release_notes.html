<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>할 일 목록 · 릴리스 노트</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='3' width='18' height='18' rx='2' fill='none' stroke='%231E2620' stroke-width='2'/%3E%3Cpath d='M7 12l3 3 7-7' fill='none' stroke='%231E2620' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
    <style>
        :root {
            --paper: #eef0e6;
            --surface: #f8f9f2;
            --ink: #1e2620;
            --muted: #6b7262;
            --rule: #c7d0be;
            --accent: #8c3229;
        }
        * { box-sizing: border-box; }
        body {
            font-family: "Pretendard Variable", "Pretendard", system-ui, -apple-system, "Segoe UI", sans-serif;
            width: 100%;
            max-width: 640px;
            margin-inline: auto;
            margin-block: clamp(1rem, 5vh, 2.5rem) 2rem;
            padding-inline: clamp(1rem, 4vw, 1.5rem);
            color: var(--ink);
            background:
                repeating-linear-gradient(var(--paper) 0 27px, var(--rule) 27px 28px),
                var(--paper);
            min-height: 100vh;
            min-height: 100svh;
        }
        @media (max-height: 480px) { body { margin-block: 1rem 1.25rem; } }
        :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
        h1 { font-family: "Gowun Batang", serif; font-weight: 700; font-size: clamp(1.3rem, 4vw + .5rem, 1.55rem); margin: 0 0 1.25rem; }
        .card {
            background: var(--surface);
            border: 1px solid var(--rule);
            border-radius: 10px;
            padding: clamp(1.1rem, 4vw, 1.4rem) clamp(1.25rem, 4vw, 1.6rem);
        }
        .card h2 { font-family: "Gowun Batang", serif; font-size: 1.1rem; margin: 1.5rem 0 .5rem; }
        .card h2:first-child { margin-top: 0; }
        .card h3 { font-size: .95rem; color: var(--muted); margin: 1rem 0 .4rem; }
        .card ul { margin: 0 0 .5rem; padding-left: 1.2rem; }
        .card li { margin: .25rem 0; }
        .card p { color: var(--muted); }
        a.back {
            display: inline-block;
            margin-bottom: 1rem;
            color: var(--ink);
            text-decoration: underline;
            font-size: .9rem;
        }
    </style>
</head>
<body>
    <h1>릴리스 노트</h1>
    <a class="back" href="/">← 할 일 목록으로 돌아가기</a>
    <div class="card">
        <!--CONTENT-->
    </div>
</body>
</html>
